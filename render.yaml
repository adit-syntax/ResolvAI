services:
  # ─── Backend: FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: ai-ticketing-backend
    runtime: python
    rootDir: ai-ticketing-system/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # Auto-generate a secure random 32-byte secret key on Render
      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"        # 24 hours

      - key: GROQ_API_KEY
        sync: false          # Optional: can also be set via Web UI

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # Seed demo user accounts on initial startup so reviewers can log in
      - key: SEED_DEMO_USERS
        value: "true"

      # PostgreSQL connection string from managed database
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ticketing-db
          property: connectionString

      # CORS origin allow-list
      - key: ALLOWED_ORIGINS
        value: "*"

      - key: ENVIRONMENT
        value: production

      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─── Frontend: Static Site ─────────────────────────────────────────────────────
  - type: web
    name: ai-ticketing-frontend
    runtime: static
    rootDir: ai-ticketing-system/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-ticketing-backend
          type: web
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

# ─── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: ai-ticketing-db
    plan: free
    databaseName: ticketing
    user: ticketing_user
