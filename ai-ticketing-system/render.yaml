services:
  # ─── Backend: FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: ai-ticketing-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # REQUIRED: Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false          # Set manually in Render dashboard

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"        # 24 hours

      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # Will be auto-filled once PostgreSQL addon is added below
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ticketing-db
          property: connectionString

      # Allow only the frontend origin — filled once frontend URL is known
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your frontend URL e.g. https://ai-ticketing-frontend.onrender.com

      - key: ENVIRONMENT
        value: production

      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─── Frontend: Static Site ─────────────────────────────────────────────────────
  - type: web
    name: ai-ticketing-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-ticketing-backend
          type: web
          property: host

# ─── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: ai-ticketing-db
    plan: free
    databaseName: ticketing
    user: ticketing_user
